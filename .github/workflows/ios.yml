name: iOS — kompilacja aplikacji natywnej
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Wersja Xcode
        run: xcodebuild -version
      - name: Kompilacja (symulator, bez podpisu)
        run: |
          cd ios
          xcodebuild -project SzybkieCzytanie.xcodeproj -scheme SzybkieCzytanie \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test ${PIPESTATUS[0]} -eq 0
