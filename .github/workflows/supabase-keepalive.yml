name: Supabase — podtrzymanie projektu (plan Free)
# Darmowy projekt Supabase jest wstrzymywany po 7 dniach słabej aktywności.
# Co 3 dni wywołujemy funkcję szybkie_czytanie.ping() kluczem publicznym (nie zwraca żadnych danych).
# Adres i klucz publiczny są w js/config.js — nie potrzeba sekretów.
on:
  schedule:
    - cron: '23 4 */3 * *'   # 04:23 UTC co 3 dni (1., 4., 7. … dzień miesiąca)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ping
        run: |
          node --input-type=module -e "
            const { SUPABASE } = await import('./js/config.js');
            if (!SUPABASE.url || !SUPABASE.key) { console.log('Brak konfiguracji w js/config.js — pomijam.'); process.exit(0); }
            const res = await fetch(SUPABASE.url + '/rest/v1/rpc/ping', {
              method: 'POST',
              headers: { apikey: SUPABASE.key, 'Content-Type': 'application/json', 'Content-Profile': SUPABASE.schema },
              body: '{}',
            });
            const body = await res.text();
            console.log(res.status, body);
            if (!res.ok) process.exit(1);
          "
